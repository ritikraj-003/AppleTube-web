      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="60%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#09090c"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="centerGloss" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Vinyl disc outer -->
  <circle cx="200" cy="200" r="195" fill="url(#vinylBg)" stroke="#2a2a35" stroke-width="3"/>
  <!-- Vinyl grooves -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#252530" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="#252530" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="200" r="135" fill="none" stroke="#252530" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="200" r="115" fill="none" stroke="#252530" stroke-width="1.5" opacity="0.5"/>
  <!-- Center Album Art Label -->
  <circle cx="200" cy="200" r="85" fill="url(#accentGrad)"/>
  <circle cx="200" cy="200" r="85" fill="url(#centerGloss)"/>
  <!-- Center Spindle Hole -->
  <circle cx="200" cy="200" r="22" fill="#09090c" stroke="#4b5563" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="10" fill="#030305"/>
